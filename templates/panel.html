<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Creas y Aprendes</title>
  <style>
    :root {
      --bg: #eae6df;
      --sidebar: #ffffff;
      --header: #075e54;
      --header-light: #128c7e;
      --chat-bg: #efeae2;
      --bubble-client: #ffffff;
      --bubble-bot: #e3f2fd;
      --bubble-human: #d9fdd3;
      --border: #d1d7db;
      --text: #111b21;
      --muted: #667781;
      --danger: #d93025;
      --success: #188038;
      --warn: #b06000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* LOGIN */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      padding: 20px;
    }
    .login-card {
      background: #fff; padding: 32px 28px; border-radius: 14px;
      width: 100%; max-width: 360px; box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-card h1 { font-size: 20px; color: var(--header); margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    .login-card input:focus { border-color: var(--header-light); }
    .login-card button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--header); color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    .login-card button:hover { background: var(--header-light); }
    #login-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* APP LAYOUT */
    #app-screen { display: none; height: 100vh; width: 100vw; }
    .layout { display: flex; height: 100%; width: 100%; }

    /* SIDEBAR */
    .sidebar {
      width: 360px; min-width: 300px; max-width: 420px;
      background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100%;
    }
    .sidebar-top {
      background: var(--header); color: #fff; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-top h2 { font-size: 16px; font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #4ade80;
      display: inline-block;
    }
    .btn-logout {
      background: rgba(255,255,255,0.18); color: #fff; border: none;
      padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }

    .search-box { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; }
    .search-box input {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #f0f2f5; font-size: 14px; outline: none;
    }

    .filters {
      display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto;
      border-bottom: 1px solid var(--border); background: #fafafa;
    }
    .filter-btn {
      padding: 5px 10px; border-radius: 14px; border: 1px solid var(--border);
      background: #fff; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--muted);
    }
    .filter-btn.active { background: var(--header); color: #fff; border-color: var(--header); }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      padding: 12px 14px; border-bottom: 1px solid #f0f2f5; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; transition: background 0.12s;
    }
    .chat-item:hover { background: #f5f6f6; }
    .chat-item.selected { background: #e9edef; }
    .chat-item-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .chat-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .chat-preview {
      font-size: 13px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
    .badge-active { background: #e6f4ea; color: var(--success); }
    .badge-paused { background: #fce8e6; color: var(--danger); }
    .badge-stage { background: #e8f0fe; color: #1967d2; }
    .badge-unread {
      background: #25d366; color: #fff; border-radius: 50%;
      min-width: 20px; height: 20px; font-size: 11px;
      display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
    }

    /* MAIN CHAT */
    .main-chat {
      flex: 1; display: flex; flex-direction: column; height: 100%;
      background: var(--chat-bg); position: relative;
    }
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: var(--muted); padding: 24px; text-align: center;
    }
    .empty-state h3 { color: var(--text); margin-bottom: 6px; font-size: 18px; }

    #chat-view { display: none; flex-direction: column; height: 100%; }
    .chat-header {
      background: #f0f2f5; padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .btn-back {
      display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--header);
    }
    .client-title { font-weight: 600; font-size: 15px; }
    .client-phone { font-size: 12px; color: var(--muted); }

    .chat-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-toggle-bot {
      padding: 7px 12px; border-radius: 8px; border: none; font-size: 12px;
      font-weight: 600; cursor: pointer; color: #fff;
    }
    .btn-pause { background: var(--danger); }
    .btn-resume { background: var(--success); }

    .crm-bar {
      background: #fff; padding: 8px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .crm-bar select, .crm-bar input {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    }
    .crm-bar input { flex: 1; min-width: 160px; }
    .btn-save-crm {
      padding: 6px 12px; background: var(--header-light); color: #fff;
      border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    /* MESSAGES */
    .messages-area {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.client { align-self: flex-start; }
    .msg-row.bot, .msg-row.human { align-self: flex-end; }
    .bubble {
      padding: 9px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08); word-wrap: break-word;
    }
    .msg-row.client .bubble { background: var(--bubble-client); border-top-left-radius: 2px; }
    .msg-row.bot .bubble { background: var(--bubble-bot); border-top-right-radius: 2px; }
    .msg-row.human .bubble { background: var(--bubble-human); border-top-right-radius: 2px; }

    .sender-tag {
      font-size: 11px; font-weight: 700; margin-bottom: 3px; display: block;
    }
    .msg-row.client .sender-tag { color: #54656f; }
    .msg-row.bot .sender-tag { color: #0d47a1; }
    .msg-row.human .sender-tag { color: #1b5e20; }

    .msg-time {
      font-size: 10px; color: var(--muted); text-align: right; margin-top: 4px; display: block;
    }
    .msg-img {
      max-width: 240px; max-height: 260px; border-radius: 8px; display: block;
      margin-bottom: 6px; cursor: zoom-in; border: 1px solid rgba(0,0,0,0.08);
    }
    .msg-doc {
      display: inline-block; padding: 8px 12px; background: rgba(0,0,0,0.06);
      border-radius: 8px; text-decoration: none; color: var(--header);
      font-weight: 600; font-size: 13px; margin-bottom: 6px;
    }

    /* QUICK REPLIES & COMPOSER */
    .quick-replies {
      background: #f7f8fa; padding: 7px 14px; border-top: 1px solid var(--border);
      display: flex; gap: 6px; overflow-x: auto;
    }
    .qr-btn {
      padding: 5px 10px; border-radius: 14px; border: 1px solid var(--header-light);
      background: #fff; color: var(--header); font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .qr-btn:hover { background: #e8f5e9; }

    .composer {
      background: #f0f2f5; padding: 10px 14px; display: flex; gap: 8px; align-items: flex-end;
    }
    .composer textarea {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      resize: none; font-size: 14px; max-height: 110px; min-height: 42px; outline: none;
    }
    .btn-send {
      padding: 10px 18px; background: var(--header); color: #fff; border: none;
      border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; height: 42px;
    }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* LIGHTBOX */
    #lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center; z-index: 999; padding: 20px; cursor: zoom-out;
    }
    #lightbox img { max-width: 95%; max-height: 92%; border-radius: 8px; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #111b21; color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 13px; display: none; z-index: 1000; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .sidebar { width: 100%; max-width: 100%; }
      .main-chat { display: none; width: 100%; }
      .layout.chat-open .sidebar { display: none; }
      .layout.chat-open .main-chat { display: flex; }
      .btn-back { display: inline-block; }
      .msg-row { max-width: 88%; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Panel Creas y Aprendes</h1>
      <p>Ingresa tu contraseña privada para auditar a Carla y ver tus chats en vivo.</p>
      <input type="password" id="pwd-input" placeholder="Contraseña del panel" autocomplete="current-password" />
      <button id="login-btn" onclick="doLogin()">Entrar al panel</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen">
    <div class="layout" id="layout">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div>
            <h2>Creas y Aprendes</h2>
          </div>
          <div class="top-actions">
            <span class="status-dot" title="Conectado en vivo (cada 5s)"></span>
            <button class="btn-logout" onclick="doLogout()">Salir</button>
          </div>
        </div>

        <div class="search-box">
          <input type="text" id="search-input" placeholder="Buscar por teléfono o nombre..." oninput="renderChatList()" />
        </div>

        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
          <button class="filter-btn" onclick="setFilter('no_leidos', this)">No leídos</button>
          <button class="filter-btn" onclick="setFilter('pausado', this)">Bot pausado</button>
          <button class="filter-btn" onclick="setFilter('link', this)">Link enviado</button>
        </div>

        <div class="chat-list" id="chat-list"></div>
      </aside>

      <main class="main-chat">
        <div class="empty-state" id="empty-state">
          <h3>Monitor en vivo de Carla</h3>
          <p>Selecciona un cliente de la izquierda para auditar la conversación, ver capturas o responder tú mismo.</p>
        </div>

        <div id="chat-view">
          <div class="chat-header">
            <div class="chat-header-left">
              <button class="btn-back" onclick="closeMobileChat()">←</button>
              <div>
                <div class="client-title" id="hdr-name">Cliente</div>
                <div class="client-phone" id="hdr-phone"></div>
              </div>
            </div>
            <div class="chat-controls">
              <button class="btn-toggle-bot" id="btn-toggle-bot" onclick="toggleBot()">Pausar a Carla</button>
            </div>
          </div>

          <div class="crm-bar">
            <select id="stage-select">
              <option value="Nuevo">Nuevo</option>
              <option value="Interesado">Interesado</option>
              <option value="Link enviado">Link enviado</option>
              <option value="Pago en revisión">Pago en revisión</option>
              <option value="Venta cerrada">Venta cerrada</option>
            </select>
            <input type="text" id="notes-input" placeholder="Notas internas (ej. Pagó con Yape, pidió apoyo...)" />
            <button class="btn-save-crm" onclick="saveClientMeta()">Guardar</button>
          </div>

          <div class="messages-area" id="messages-area"></div>

          <div class="quick-replies">
            <button class="qr-btn" onclick="insertQuick('control')">Tomar control</button>
            <button class="qr-btn" onclick="insertQuick('link')">Enlace oficial</button>
            <button class="qr-btn" onclick="insertQuick('hotmart')">Guía Hotmart</button>
            <button class="qr-btn" onclick="insertQuick('vip')">Grupo VIP</button>
          </div>

          <div class="composer">
            <textarea id="msg-input" rows="1" placeholder="Escribe una respuesta manual (pausa a Carla en este chat)..."></textarea>
            <button class="btn-send" id="btn-send" onclick="sendManual()">Enviar</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Vista ampliada" />
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <script>
    let allChats = [];
    let currentPhone = null;
    let currentClient = null;
    let currentFilter = 'todos';
    let lastMsgCount = 0;
    let pollTimer = null;

    const QUICK_TEXTS = {
      control: "¡Hola! Te saluda el equipo de soporte de Creas y Aprendes 😊 ¿En qué paso te puedo ayudar ahora mismo?",
      link: "Aquí tienes tu enlace oficial con el 50% de descuento y los 18 bonos incluidos 👇\nhttps://go.hotmart.com/B107690612B?ap=b04a",
      hotmart: "Para ingresar a tus clases, entra a consumer.hotmart.com o a la app de Hotmart con el mismo correo que usaste al pagar, crea tu contraseña (7 a 20 caracteres con letra y número, sin espacios) y entra a 'Mis compras' 📲",
      vip: "Para unirte a la Comunidad VIP de Apoyo (6 meses), ingresa en Hotmart al programa de Velas Artesanales y ve al Módulo 2; ahí tienes el acceso directo al grupo ✨"
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._tid);
      t._tid = setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatWaText(str) {
      let safe = escapeHtml(str);
      safe = safe.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
      safe = safe.replace(/~([^~]+)~/g, '<del>$1</del>');
      safe = safe.replace(/\n/g, '<br>');
      return safe;
    }

    document.getElementById('pwd-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    document.getElementById('msg-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendManual();
      }
    });

    async function doLogin() {
      const pwd = document.getElementById('pwd-input').value.trim();
      const err = document.getElementById('login-error');
      err.textContent = '';
      if (!pwd) { err.textContent = 'Escribe tu contraseña.'; return; }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          document.getElementById('pwd-input').value = '';
          enterApp();
        } else {
          err.textContent = data.error || 'Contraseña incorrecta.';
        }
      } catch (e) {
        err.textContent = 'Error de conexión con el servidor.';
      }
    }

    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      stopPolling();
      currentPhone = null;
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function enterApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      refreshAll(true);
      startPolling();
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => {
        if (!document.hidden) refreshAll(false);
      }, 5000);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && document.getElementById('app-screen').style.display === 'block') {
        refreshAll(false);
      }
    });

    async function refreshAll(forceScroll) {
      try {
        const res = await fetch('/api/chats');
        if (res.status === 401) {
          stopPolling();
          document.getElementById('app-screen').style.display = 'none';
          document.getElementById('login-screen').style.display = 'flex';
          return;
        }
        const data = await res.json();
        if (data.ok) {
          allChats = data.chats || [];
          renderChatList();
        }
        if (currentPhone) {
          await loadChat(currentPhone, forceScroll, true);
        }
      } catch (e) {
        console.error('Error refrescando:', e);
      }
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChatList();
    }

    function renderChatList() {
      const container = document.getElementById('chat-list');
      const q = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allChats.filter(c => {
        const matchQ = !q ||
          (c.telefono || '').toLowerCase().includes(q) ||
          (c.nombre || '').toLowerCase().includes(q);
        if (!matchQ) return false;

        if (currentFilter === 'no_leidos') return (c.no_leidos || 0) > 0;
        if (currentFilter === 'pausado') return c.estado_bot === 'PAUSADO';
        if (currentFilter === 'link') return c.etapa === 'Link enviado';
        return true;
      });

      if (!filtered.length) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#667781;font-size:13px;">No hay conversaciones en esta vista.</div>';
        return;
      }

      container.innerHTML = filtered.map(c => {
        const isSel = c.telefono === currentPhone ? 'selected' : '';
        const botBadge = c.estado_bot === 'PAUSADO'
          ? '<span class="badge badge-paused">Bot pausado</span>'
          : '<span class="badge badge-active">Carla activa</span>';
        const stageBadge = `<span class="badge badge-stage">${escapeHtml(c.etapa || 'Nuevo')}</span>`;
        const unread = (c.no_leidos || 0) > 0
          ? `<span class="badge-unread">${c.no_leidos}</span>`
          : '';
        const displayName = c.nombre && c.nombre !== c.telefono ? c.nombre : c.telefono;

        return `
          <div class="chat-item ${isSel}" onclick="openChat('${escapeHtml(c.telefono)}')">
            <div class="chat-item-row">
              <span class="chat-name">${escapeHtml(displayName)}</span>
              <span class="chat-time">${escapeHtml(c.ultima_fecha || '')}</span>
            </div>
            <div class="chat-item-row">
              <span class="chat-preview">${escapeHtml(c.ultimo_mensaje || '')}</span>
              ${unread}
            </div>
            <div class="badges">${botBadge}${stageBadge}</div>
          </div>
        `;
      }).join('');
    }

    async function openChat(phone) {
      currentPhone = phone;
      lastMsgCount = 0;
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
      document.getElementById('layout').classList.add('chat-open');
      renderChatList();
      await loadChat(phone, true, false);
    }

    function closeMobileChat() {
      document.getElementById('layout').classList.remove('chat-open');
    }

    async function loadChat(phone, forceScroll, isBackground) {
      try {
        const res = await fetch('/api/chat/' + encodeURIComponent(phone));
        if (!res.ok) return;
        const data = await res.json();
        if (!data.ok) return;

        currentClient = data.cliente;
        const msgs = data.mensajes || [];

        const displayName = currentClient.nombre && currentClient.nombre !== currentClient.telefono
          ? currentClient.nombre : currentClient.telefono;
        document.getElementById('hdr-name').textContent = displayName;
        document.getElementById('hdr-phone').textContent = '+' + currentClient.telefono;

        const btnBot = document.getElementById('btn-toggle-bot');
        if (currentClient.estado_bot === 'PAUSADO') {
          btnBot.textContent = '▶ Reactivar a Carla';
          btnBot.className = 'btn-toggle-bot btn-resume';
        } else {
          btnBot.textContent = '⏸ Pausar a Carla';
          btnBot.className = 'btn-toggle-bot btn-pause';
        }

        if (!isBackground) {
          document.getElementById('stage-select').value = currentClient.etapa || 'Nuevo';
          document.getElementById('notes-input').value = currentClient.notas || '';
        }

        const area = document.getElementById('messages-area');
        const wasNearBottom = (area.scrollHeight - area.scrollTop - area.clientHeight) < 80;
        const hasNew = msgs.length !== lastMsgCount;

        if (forceScroll || hasNew) {
          area.innerHTML = msgs.map(m => {
            let roleClass = 'client';
            let tag = 'Cliente';
            if (m.remitente === 'CARLA') { roleClass = 'bot'; tag = '🤖 Carla'; }
            else if (m.remitente === 'HUMANO') { roleClass = 'human'; tag = '👤 Tú'; }

            let mediaHtml = '';
            if (m.media_id && m.media_type === 'image') {
              const url = '/api/media/' + encodeURIComponent(m.media_id);
              mediaHtml = `<img class="msg-img" src="${url}" alt="Imagen recibida" onclick="openLightbox('${url}')" />`;
            } else if (m.media_id && m.media_type === 'document') {
              const url = '/api/media/' + encodeURIComponent(m.media_id);
              mediaHtml = `<a class="msg-doc" href="${url}" target="_blank" rel="noopener">📄 Abrir documento adjunto</a>`;
            }

            return `
              <div class="msg-row ${roleClass}">
                <div class="bubble">
                  <span class="sender-tag">${tag}</span>
                  ${mediaHtml}
                  <div>${formatWaText(m.texto || '')}</div>
                  <span class="msg-time">${escapeHtml(m.fecha || '')}</span>
                </div>
              </div>
            `;
          }).join('');

          lastMsgCount = msgs.length;
          if (forceScroll || wasNearBottom) {
            area.scrollTop = area.scrollHeight;
          }
        }
      } catch (e) {
        console.error('Error cargando chat:', e);
      }
    }

    async function toggleBot() {
      if (!currentPhone || !currentClient) return;
      const nuevo = currentClient.estado_bot === 'PAUSADO' ? 'ACTIVO' : 'PAUSADO';
      try {
        const res = await fetch('/api/toggle_bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefono: currentPhone, estado_bot: nuevo })
        });
        const data = await res.json();
        if (data.ok) {
          showToast(nuevo === 'PAUSADO' ? 'Carla pausada en este chat' : 'Carla reactivada en este chat');
          await refreshAll(false);
        }
      } catch (e) {
        showToast('No se pudo cambiar el estado');
      }
    }

    async function saveClientMeta() {
      if (!currentPhone) return;
      const etapa = document.getElementById('stage-select').value;
      const notas = document.getElementById('notes-input').value.trim();
      try {
        const res = await fetch('/api/update_client', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefono: currentPhone, etapa, notas })
        });
        const data = await res.json();
        if (data.ok) {
          showToast('Guardado en Google Sheets ✓');
          await refreshAll(false);
        }
      } catch (e) {
        showToast('Error al guardar cambios');
      }
    }

    function insertQuick(key) {
      const box = document.getElementById('msg-input');
      box.value = QUICK_TEXTS[key] || '';
      box.focus();
    }

    async function sendManual() {
      if (!currentPhone) return;
      const box = document.getElementById('msg-input');
      const btn = document.getElementById('btn-send');
      const texto = box.value.trim();
      if (!texto) return;

      btn.disabled = true;
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefono: currentPhone, texto })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          box.value = '';
          showToast('Mensaje enviado (Carla pausada en este chat)');
          await refreshAll(true);
        } else {
          showToast(data.error || 'Meta no permitió enviar el mensaje (revisa ventana 24h)');
        }
      } catch (e) {
        showToast('Error de red al enviar');
      } finally {
        btn.disabled = false;
      }
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
      document.getElementById('lightbox-img').src = '';
    }

    // Verificar si ya hay sesión activa al abrir /panel
    (async function init() {
      try {
        const res = await fetch('/api/chats');
        if (res.ok) {
          enterApp();
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
